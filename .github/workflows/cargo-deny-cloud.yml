name: Repair cargo-deny with Claude

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      auth_only:
        description: Verify GitHub App access and renewal without starting a repair
        type: boolean
        default: false

# Only one repair loop may operate on main at a time.
concurrency:
  group: cargo-deny-cloud-repair
  cancel-in-progress: false

permissions:
  contents: read
  # Lets the job's GITHUB_TOKEN dispatch cargo-deny-agent.yml.
  actions: write

jobs:
  repair:
    if: >-
      github.repository == 'sarkologist/anki-personal'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch'
          || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      # Never check out the failed PR's code in this privileged workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Test controller gates
        run: python3 -m unittest discover -s .github/scripts/tests

      - name: Repair, independently review, validate, and merge
        env:
          CARGO_DENY_APP_ID: ${{ vars.CARGO_DENY_APP_ID }}
          CARGO_DENY_APP_PRIVATE_KEY: ${{ secrets.CARGO_DENY_APP_PRIVATE_KEY }}
          AGENT_DISPATCH_TOKEN: ${{ github.token }}
          AUTH_CHECK_ONLY: ${{ inputs.auth_only == true && 'true' || 'false' }}
        run: |
          for name in CARGO_DENY_APP_ID CARGO_DENY_APP_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required credential: $name. See docs/cargo-deny-cloud.md."
              exit 1
            fi
          done
          python3 .github/scripts/cargo_deny_cloud.py
